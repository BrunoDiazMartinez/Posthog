#
# Override para la MÁQUINA DE DATOS (la que aloja ClickHouse + Redpanda/Kafka + ZooKeeper).
#
# Uso en la máquina de datos (misma estructura de carpetas que el hobby normal:
# este repo, ./posthog con el código, y un .env con las variables):
#
#   DATA_BIND_IP=<ip-lan-de-esta-maquina> docker compose \
#     -f docker-compose.hobby.yml -f docker-compose.hobby.data-node.yml \
#     up -d clickhouse zookeeper kafka kafka-init
#
# Solo se levantan esos 4 servicios (más lo que declaren en depends_on).
# Publica los puertos en la IP LAN para que la máquina de aplicación los alcance.
# SEGURIDAD: ClickHouse y Kafka quedan SIN autenticación; limita el acceso por firewall
# a la IP de la máquina de aplicación (puertos 8123, 9000 y 9092).
#

services:
    clickhouse:
        ports:
            - '${DATA_BIND_IP:?define DATA_BIND_IP}:8123:8123'
            - '${DATA_BIND_IP}:9000:9000'

    kafka:
        ports:
            - '${DATA_BIND_IP}:9092:9092'
        # Misma config que docker-compose.base.yml pero con menos memoria reservada
        # (la base reserva 3G y 2 cores). Sube --memory si ves presión en Redpanda.
        command:
            - redpanda
            - start
            - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
            - --advertise-kafka-addr internal://kafka:9092,external://localhost:19092
            - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
            - --advertise-pandaproxy-addr internal://kafka:8082,external://localhost:18082
            - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
            - --rpc-addr kafka:33145
            - --advertise-rpc-addr kafka:33145
            - --mode dev-container
            - --smp 1
            - --memory 1500M
            - --reserve-memory 200M
            - --overprovisioned
            - --set redpanda.empty_seed_starts_cluster=false
            - --seeds kafka:33145
            - --set redpanda.auto_create_topics_enabled=true
